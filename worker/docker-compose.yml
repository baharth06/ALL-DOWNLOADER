services:
  media-worker:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:-}
      PUBLIC_WORKER_URL: ${PUBLIC_WORKER_URL:-http://127.0.0.1:8000}
      RETENTION_SECONDS: ${RETENTION_SECONDS:-3600}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1073741824}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      ANALYZE_CACHE_SECONDS: ${ANALYZE_CACHE_SECONDS:-300}
      ANALYZE_CACHE_MAX: ${ANALYZE_CACHE_MAX:-32}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
    volumes:
      - worker-data:/app/data
volumes:
  worker-data:
